name = "yamalog"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# workers.dev の URL には Cloudflare Access を直接かけられる。
# ダッシュボード → Workers & Pages → yamalog → Settings → Domains & Routes →
# workers.dev の「Enable Cloudflare Access」。独自ドメインは不要。
# エッジで認証したうえで、Worker 側でも JWT を検証する（src/lib/access.ts）。
workers_dev = true

# Preview URL（<version>-yamalog.<subdomain>.workers.dev）は上の Access の
# 対象外になり、認証を迂回する入口になるため必ず塞ぐ。
# Wrangler 3.91.0 以降で有効なキー。古い版では既定で有効なままなので注意。
preview_urls = false

# 独自ドメインで受けたくなったら（DEPLOY.md 付録参照）。ゾーンをCloudflareに載せてから設定する。
# その場合は workers_dev = false に戻して入口を1つにする。
# [[routes]]
# pattern = "yamalog.example.com"
# custom_domain = true

# フロント（Vite ビルド成果物）を同一 Worker から配信する
[assets]
directory = "./dist/web"
binding = "ASSETS"
not_found_handling = "single-page-application"
# 既定ではアセットが Worker より先に配信され、認証ミドルウェアを通らない。
# アプリシェルやJSも許可ユーザーだけに配りたいので、必ず Worker を先に走らせる。
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "yamalog"
# `wrangler d1 create yamalog` の出力（2026-08-13 に作成したもの）
database_id = "37b7f592-376e-4abf-bf83-6d90542b9db5"
migrations_dir = "migrations"

# 画像の保存先。'd1' なら表示用とサムネイルを D1 に入れ、原本は保存しない。
# R2 はアカウント側の有効化（支払い方法の登録）が必要なため、既定はこちら。
[vars]
PHOTO_STORAGE = "d1"

# R2 を有効化して原本も保存する場合は PHOTO_STORAGE を "r2" にして、以下を有効にする。
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "yamalog-photos"

# 認証の設定値は wrangler secret put で入れる（メールアドレスをリポジトリに置かない）:
#   ACCESS_TEAM_DOMAIN   例: your-team.cloudflareaccess.com
#   ACCESS_AUD           Access アプリケーションの Audience Tag
#   ALLOWED_EMAILS       利用を許可するメールアドレス（カンマ区切り）
# 未設定のまま本番に出すと、Worker は 503 を返して閉じたままになる。

[observability]
enabled = true
