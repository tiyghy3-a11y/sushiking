name: Deploy

on:
  push:
    branches: [main]
  # 手動実行。初回だけ D1/R2 の作成・マイグレーション・マスタ投入までまとめてやれる
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'D1/R2の作成・マイグレーション・百名山マスタ投入も行う（初回のみ）'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

      # 初回: リソース作成 → マイグレーション → マスタ投入 → ビルド → デプロイ
      - name: Bootstrap and deploy
        if: inputs.bootstrap
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx tsx scripts/bootstrap-deploy.ts

      # 通常: ビルドしてデプロイするだけ（D1のマイグレーションは手元から叩く方針）
      - run: npm run build
        if: '!inputs.bootstrap'
      - uses: cloudflare/wrangler-action@v3
        if: '!inputs.bootstrap'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
# D1 のマイグレーションを push で自動実行しないのは事故を避けるため。
# スキーマを変えたときは手元から `npm run db:migrate` を叩く。
