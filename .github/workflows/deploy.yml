name: GitHub Pages へデプロイ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存関係インストール
        run: npm ci

      - name: ビルド
        run: npm run build

      - name: Pages 設定
        uses: actions/configure-pages@v5

      - name: アーティファクトをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: デプロイ
        id: deployment
        uses: actions/deploy-pages@v4
